<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextTrade — Email Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1527;
    --surface: #171D31;
    --surface-2: #1F2742;
    --border: #2A3354;
    --text: #E2F8FF;
    --text-dim: #8B9BB8;
    --accent: #08F295;
    --accent-soft: rgba(8, 242, 149, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Parkinsans', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }

  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header { padding: 28px 24px 20px; border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .brand-name { font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); }
  .sidebar-title { font-size: 22px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; }
  .sidebar-sub { font-size: 13px; color: var(--text-dim); margin-top: 6px; }

  .email-list { flex: 1; overflow-y: auto; padding: 12px; }
  .section-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--text-dim);
    padding: 14px 12px 8px;
  }

  .email-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px; border-radius: 10px; cursor: pointer;
    transition: background 0.15s ease;
    border: 1px solid transparent;
    margin-bottom: 2px;
  }
  .email-item:hover { background: var(--surface-2); }
  .email-item.active { background: var(--surface-2); border-color: var(--border); }
  .email-item.active .email-tag { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  .email-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 500;
    padding: 4px 8px; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text-dim); flex-shrink: 0; margin-top: 1px;
    min-width: 26px; text-align: center;
  }
  .email-info { flex: 1; min-width: 0; }
  .email-subject { font-size: 14px; font-weight: 500; line-height: 1.35; color: var(--text); margin-bottom: 4px; }
  .email-meta { font-size: 12px; color: var(--text-dim); display: flex; gap: 8px; align-items: center; }
  .email-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-dim); }

  .viewer { display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 32px; border-bottom: 1px solid var(--border);
    background: var(--surface); gap: 16px;
  }
  .toolbar-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .current-subject { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .current-meta { font-size: 12px; color: var(--text-dim); }
  .toolbar-right { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

  .device-toggle { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
  .device-btn {
    background: none; border: none; color: var(--text-dim);
    font-family: inherit; font-size: 12px; font-weight: 500;
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
    transition: all 0.15s ease;
  }
  .device-btn:hover { color: var(--text); }
  .device-btn.active { background: var(--surface-2); color: var(--accent); }

  .preview-area {
    flex: 1; overflow: auto; padding: 32px;
    display: flex; justify-content: center; align-items: flex-start;
    background:
      radial-gradient(circle at 20% 0%, rgba(8, 242, 149, 0.04), transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(79, 187, 227, 0.04), transparent 50%),
      var(--bg);
  }
  .iframe-wrap {
    background: #0D1210; border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px var(--border);
    overflow: hidden;
    transition: max-width 0.25s ease;
    width: 100%;
  }
  .iframe-wrap.desktop { max-width: 720px; }
  .iframe-wrap.mobile  { max-width: 380px; }
  iframe {
    width: 100%; height: calc(100vh - 160px);
    border: none; display: block; background: #0D1210;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--surface-2); }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }
</style>
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-dot"></div>
        <div class="brand-name">NextTrade &times; FunderPro</div>
      </div>
      <h1 class="sidebar-title">Email Preview</h1>
      <p class="sidebar-sub">Launch &amp; bonus broadcast review</p>
    </div>

    <nav class="email-list" id="emailList">
      <div class="section-label">10 Emails</div>
    </nav>
  </aside>

  <main class="viewer">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="current-subject" id="currentSubject">Select an email to preview</div>
        <div class="current-meta" id="currentMeta">NextTrade broadcast</div>
      </div>
      <div class="toolbar-right">
        <div class="device-toggle">
          <button class="device-btn active" data-device="desktop">Desktop</button>
          <button class="device-btn" data-device="mobile">Mobile</button>
        </div>
      </div>
    </div>

    <div class="preview-area">
      <div class="iframe-wrap desktop" id="iframeWrap">
        <iframe id="previewFrame"></iframe>
      </div>
    </div>
  </main>

</div>

  const list = document.getElementById('emailList');
  const frame = document.getElementById('previewFrame');
  const subjectEl = document.getElementById('currentSubject');
  const metaEl = document.getElementById('currentMeta');
  const iframeWrap = document.getElementById('iframeWrap');
  const deviceBtns = document.querySelectorAll('.device-btn');

  // Build sidebar items
  EMAILS.forEach((email, idx) => {
    const item = document.createElement('div');
    item.className = 'email-item';
    item.dataset.idx = idx;
    item.innerHTML = `
      <span class="email-tag">${String(idx + 1).padStart(2, '0')}</span>
      <div class="email-info">
        <div class="email-subject">${email.subject}</div>
        <div class="email-meta"><span>${email.label}</span><span class="dot"></span><span>${email.note}</span></div>
      </div>
    `;
    item.addEventListener('click', () => loadEmail(idx));
    list.appendChild(item);
  });

  function loadEmail(idx) {
    document.querySelectorAll('.email-item').forEach(i => i.classList.remove('active'));
    document.querySelector(`.email-item[data-idx="${idx}"]`).classList.add('active');

    const email = EMAILS[idx];
    subjectEl.textContent = email.subject;
    metaEl.textContent = `${email.label} · ${email.note}`;

    // Decode base64 → HTML → srcdoc
    const html = atob(email.b64);
    // Need to decode UTF-8 properly
    const bytes = Uint8Array.from(html, c => c.charCodeAt(0));
    const decoded = new TextDecoder('utf-8').decode(bytes);
    frame.srcdoc = decoded;
  }

  deviceBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      deviceBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      iframeWrap.classList.remove('desktop', 'mobile');
      iframeWrap.classList.add(btn.dataset.device);
    });
  });

  // Auto-select first
  loadEmail(0);
</script>
